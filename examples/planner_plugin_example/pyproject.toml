[project]
name = "example-planner-plugin"
version = "0.1.0"
description = "Example planner plugin for Shoemaker Elves"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "shoemaker-elves",
]

[project.entry-points."shoemaker_elves.planners"]
example = "example_planner:register"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
