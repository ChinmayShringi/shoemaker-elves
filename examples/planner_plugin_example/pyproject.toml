[project]
name = "example-planner-plugin"
version = "0.1.0"
description = "Example planner plugin for GPT Agent Orchestrator"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "gpt-agent-orchestrator",
]

[project.entry-points."gpt_orch.planners"]
example = "example_planner:register"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
